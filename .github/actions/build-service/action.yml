name: Build Service

description: Build Maven module, build Docker image and push to DockerHub

inputs:

  module:
    required: true

  dockerfile:
    required: true

  image-name:
    required: true

  image-tag:
    required: true

  firebase-credentials:
    required: false

runs:

  using: composite

  steps:

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

################################################################################
# Create Firebase Config (Notification Service Only)
################################################################################

    - name: Create Firebase Config
      if: ${{ inputs.module == 'Notification-Service' }}
      shell: bash
      run: |
        mkdir -p Notification-Service/src/main/resources
        cat > Notification-Service/src/main/resources/firebase-config.json <<EOF
        ${{ inputs.firebase-credentials }}
        EOF

################################################################################
# Build Maven Module
################################################################################

    - name: Build Maven Module
      shell: bash
      run: |
        mvn \
          -B \
          clean \
          package \
          -DskipTests \
          -pl ${{ inputs.module }} \
          -am

################################################################################
# Docker
################################################################################

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Build and Push Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true

        tags: |
          ${{ env.DOCKER_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          ${{ env.DOCKER_USERNAME }}/${{ inputs.image-name }}:latest

        cache-from: type=gha
        cache-to: type=gha,mode=max