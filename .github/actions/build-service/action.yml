name: Build Service

description: Build Maven module, build Docker image and push to DockerHub

inputs:

  module:
    required: true

  dockerfile:
    required: true

  image-name:
    required: true

  image-tag:
    required: true

runs:

  using: composite

  steps:

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build Maven Module
      shell: bash
      run: |

        mvn \
          -B \
          clean \
          package \
          -DskipTests \
          -pl ${{ inputs.module }} \
          -am

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_TOKEN }}

    - name: Build and Push Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true

        tags: |
          ${{ env.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          ${{ env.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}:latest

        cache-from: type=gha
        cache-to: type=gha,mode=max