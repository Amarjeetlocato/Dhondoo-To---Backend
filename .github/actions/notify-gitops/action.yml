name: Notify GitOps

description: Send deployment event to GitOps repository

inputs:
  service:
    required: true

  image:
    required: true

  tag:
    required: true

  environment:
    required: true

runs:
  using: composite

  steps:

    - name: Send Repository Dispatch
      shell: bash
      env:
        GITOPS_TOKEN: ${{ env.GITOPS_TOKEN }}
        DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
      run: |
        set -euo pipefail

        echo "=========================================="
        echo "Sending GitOps deployment event"
        echo "=========================================="
        echo "Service:     ${{ inputs.service }}"
        echo "Image:       ${DOCKER_USERNAME}/${{ inputs.image }}"
        echo "Tag:         ${{ inputs.tag }}"
        echo "Environment: ${{ inputs.environment }}"
        echo "Repository:  ${GITHUB_REPOSITORY}"
        echo "Commit:      ${GITHUB_SHA}"
        echo "=========================================="

        curl --fail-with-body -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GITOPS_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Content-Type: application/json" \
          "https://api.github.com/repos/Amarjeetlocato/Dhondoo-To---gitops/dispatches" \
          -d "{
            \"event_type\": \"backend-image-published\",
            \"client_payload\": {
              \"service\": \"${{ inputs.service }}\",
              \"image\": \"${DOCKER_USERNAME}/${{ inputs.image }}\",
              \"tag\": \"${{ inputs.tag }}\",
              \"environment\": \"${{ inputs.environment }}\",
              \"repository\": \"${GITHUB_REPOSITORY}\",
              \"commit\": \"${GITHUB_SHA}\"
            }
          }"

        echo "GitOps repository dispatch sent successfully."