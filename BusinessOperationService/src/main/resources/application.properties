# =========================================================
# APPLICATION
# =========================================================

spring.application.name=BusinessOperationService
server.port=8090

# =========================================================
# SERVER
# =========================================================

server.servlet.context-path=/

# =========================================================
# DATABASE - MYSQL
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/business_operation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# -------------------------
# Kafka Producer
# -------------------------

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

# -------------------------
# Kafka Consumer
# -------------------------

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:business-operation-service-group}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.whoami.*

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# -------------------------
# Kafka Listener
# -------------------------

spring.kafka.listener.ack-mode=manual

# =========================================================
# EUREKA
# =========================================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,prometheus,metrics

management.endpoint.health.show-details=always

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# =========================================================
# PROMETHEUS
# =========================================================

management.prometheus.metrics.export.enabled=true

# =========================================================
# CLOUDINARY
# =========================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =========================================================
# KAFKA TOPICS
# =========================================================

app.kafka.topic.business-events=${BUSINESS_EVENTS_TOPIC:business-events}
app.kafka.topic.business-verification=${BUSINESS_VERIFICATION_TOPIC:business-verification}
app.kafka.topic.business-capability=${BUSINESS_CAPABILITY_TOPIC:business-capability}

# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.com.whoami.businessoperation=INFO

# =========================================================
# TIMEZONE
# =========================================================

spring.jackson.time-zone=UTC

# =========================================================
# JSON
# =========================================================

spring.jackson.serialization.write-dates-as-timestamps=false