spring.application.name=gateway
server.port=8079
server.address=0.0.0.0

# ============================================================
# EUREKA
# ============================================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=10
eureka.client.instance-info-replication-interval-seconds=30

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

eureka.client.healthcheck.enabled=true


# ============================================================
# MANAGEMENT / ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=*


# ============================================================
# SPRING CLOUD GATEWAY DISCOVERY
# ============================================================

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# ============================================================
# JWT CONFIGURATION
# Matches UserRegistry & SuperUser JWT secrets
# ============================================================

jwt.admin-secret=${JWT_ADMIN_SECRET:WHOAMI_SUPERUSER_SECRET_KEY_2026_VERY_SECURE_TOKEN_STRING}
jwt.user-secret=${JWT_USER_SECRET:afafasfafafasfasfasfafacasdasfasxASFACASDFACASDFASFASFDAFASFASDAADSCSDFADCVSGCFVADXCcadwavfsfarvf}


# ============================================================
# GATEWAY HTTP CLIENT / TIMEOUTS
# ============================================================

spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=60s
spring.cloud.gateway.httpclient.ssl.handshake-timeout=20000ms

spring.cloud.gateway.httpclient.pool.max-connections=100
spring.cloud.gateway.httpclient.pool.max-idle-time=1800s
spring.cloud.gateway.httpclient.pool.pending-acquire-timeout=45000ms
spring.cloud.gateway.httpclient.pool.pending-acquire-max-count=-1


# ============================================================
# USER AUTH SERVICE
# ============================================================

spring.cloud.gateway.routes[0].id=userRegistery
spring.cloud.gateway.routes[0].uri=lb://USERREGISTRY
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/user/**


# ============================================================
# SHOP SERVICE
# ============================================================

spring.cloud.gateway.routes[1].id=shop-service
spring.cloud.gateway.routes[1].uri=lb://SHOP-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/businesses/**,/api/services/**,/api/customer-profiles/**,/api/locations/**,/api/nearby/**,/api/products/**,/api/reels/**,/api/shops/**,/api/mobile/**,/api/users/**,/api/reviews/**,/api/shop-follow/**,/api/public/**,/internal/**


# ============================================================
# CHAT SERVICE
# ============================================================

spring.cloud.gateway.routes[2].id=Servicechat
spring.cloud.gateway.routes[2].uri=lb://SERVICECHAT
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/chat/**


# ============================================================
# ORDER SERVICE
# ============================================================

spring.cloud.gateway.routes[3].id=OrderService
spring.cloud.gateway.routes[3].uri=lb://ORDERSERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/cart/**,/api/orders/**,/api/analytics/**


# ============================================================
# ADMIN / SUPER USER SERVICE
# ============================================================

spring.cloud.gateway.routes[4].id=SuperUser
spring.cloud.gateway.routes[4].uri=lb://SuperUser
spring.cloud.gateway.routes[4].predicates[0]=Path=/admin/**,/api/admin/**


# ============================================================
# NOTIFICATION SERVICE
# ============================================================

spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/activity-logs/**,/api/device-tokens/**,/api/notifications/**,/api/preferences/**


# ============================================================
# BUSINESS OPERATION SERVICE
# ============================================================

spring.cloud.gateway.routes[6].id=business-operation-service
spring.cloud.gateway.routes[6].uri=lb://BUSINESSOPERATIONSERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/business-operations/**


# ============================================================
# BILLING SERVICE
# ============================================================

spring.cloud.gateway.routes[7].id=billing-service
spring.cloud.gateway.routes[7].uri=lb://BILLINGSERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/billing/**,/api/payments/**


# ============================================================
# LOGGING & CORS
# ============================================================

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
app.cors.allowed-origins=*
