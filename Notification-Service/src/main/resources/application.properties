```properties
# ============================================================
# Application
# ============================================================

spring.application.name=notification-service
server.port=8087

# ============================================================
# Database
# ============================================================

spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/notification}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Kafka
# ============================================================

spring.kafka.bootstrap-servers=${KAFKA_SERVERS:kafka:9092}

spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.whoami.launch.dto.NotificationEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.whoami.dto,com.whoami.launch.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=true

# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://eureka:8761/eureka/}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true
eureka.instance.metadata-map.version=1.0.0

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ============================================================
# Hikari Connection Pool
# ============================================================

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# Spring Boot Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.export.prometheus.enabled=true

# ============================================================
# Logging
# ============================================================

logging.level.root=INFO
logging.level.com.whoami.launch=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.file.name=logs/notification-service.log
logging.file.max-size=10MB
logging.file.max-history=30

# ============================================================
# OpenFeign
# ============================================================

feign.hystrix.enabled=false
feign.circuitbreaker.enabled=true

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# ============================================================
# Resilience4j
# ============================================================

resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=1000

resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=5

# ============================================================
# Swagger / OpenAPI
# ============================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method

# ============================================================
# Firebase
# ============================================================

firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-config.json}
firebase.database-url=${FIREBASE_DATABASE_URL:https://your-firebase-project.firebaseio.com}

# ============================================================
# Thread Pool
# ============================================================

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# ============================================================
# Jackson
# ============================================================

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# ============================================================
# Notification
# ============================================================

app.notification.fcm.max-retries=3
app.notification.fcm.retry-delay-ms=1000
app.notification.batch-size=100
app.notification.retention-days=90

# ============================================================
# Environment
# ============================================================

app.env=${APP_ENV:development}
```
