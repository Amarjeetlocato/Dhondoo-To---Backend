# Gateway Configuration File Example
# Add this to your application.properties or application.yml for Spring Cloud Gateway

# ==============================================
# Spring Cloud Gateway Configuration
# ==============================================

# Gateway server port
server.port=8080

# ==============================================
# Routes Configuration
# ==============================================

spring.cloud.gateway.routes[0].id=admin-service
spring.cloud.gateway.routes[0].uri=http://localhost:8088
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/**
spring.cloud.gateway.routes[0].filters[0].name=GatewayTokenValidationFilter

# Public routes (no token validation)
spring.cloud.gateway.routes[1].id=public-auth
spring.cloud.gateway.routes[1].uri=http://localhost:8088
spring.cloud.gateway.routes[1].predicates[0]=Path=/admin/auth/**

# ==============================================
# Token Validation Properties
# ==============================================

# Token validity period (in milliseconds)
jwt.access-expiration=3600000

# Token refresh period (in milliseconds)
jwt.refresh-expiration=604800000

# JWT Secret (must match with SuperUser app)
jwt.secret=SuperUserSecretKeyWhoamiPlatform2026

# ==============================================
# Logging Configuration
# ==============================================

logging.level.com.whoami.launch.security=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG

# ==============================================
# Eureka Configuration (Optional)
# ==============================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==============================================
# Gateway Documentation
# ==============================================

# USAGE GUIDE:
# 
# 1. APPLY FILTER TO ROUTES:
#    The GatewayTokenValidationFilter will:
#    - Extract JWT token from Authorization header
#    - Validate token signature and expiration
#    - Add X-User-Email and X-Admin-Id headers to requests
#    - Block unauthorized requests with 401 status
# 
# 2. PUBLIC PATHS (No validation required):
#    - /admin/auth/register
#    - /admin/auth/login
#    - /admin/auth/setup-totp/**
#    - /admin/auth/verify-totp
#    - /admin/auth/refresh
#
# 3. REQUEST HEADERS TO SEND:
#    Authorization: Bearer {JWT_TOKEN}
#
# 4. RESPONSE HEADERS FROM GATEWAY (if token valid):
#    X-User-Email: user@example.com
#    X-Admin-Id: admin123
#
# 5. DOWNSTREAM SERVICES RECEIVE:
#    All original headers +
#    X-User-Email: {extracted from token}
#    X-Admin-Id: {extracted from token}
#
# 6. TOKEN VALIDATION API ENDPOINTS:
#    GET  /internal/token/validate - Validate from Authorization header
#    POST /internal/token/validate-token - Validate from request body
#    GET  /internal/token/details - Get token details
#    GET  /internal/token/is-valid - Quick validation (boolean)
#
# 7. EXAMPLE REQUEST:
#    curl -H "Authorization: Bearer eyJhbGciOiJIUzI1NiJ9..." \
#         http://localhost:8080/admin/users
#
# 8. ERROR RESPONSES:
#    - 401 Unauthorized: Invalid/expired token
#    - 400 Bad Request: Missing Authorization header
#    - 403 Forbidden: Token signature invalid
