spring.application.name=SuperUser
server.port=8088
server.address=0.0.0.0

# ============================================================
# DATASOURCE
# ============================================================
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/superuser?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# KAFKA & EUREKA
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ============================================================
# SECURITY & JWT
# ============================================================
jwt.secret=${JWT_SECRET:WHOAMI_SUPERUSER_SECRET_KEY_2026_VERY_SECURE_TOKEN_STRING}
jwt.access-expiration=3600000
jwt.refresh-expiration=604800000

internal.api.key=${INTERNAL_API_KEY:WHOAMI_INTERNAL_2026}

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# ACTUATOR & LOGGING
# ============================================================
logging.level.org.springframework.security=INFO
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
