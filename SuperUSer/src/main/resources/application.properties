spring.application.name=SuperUser
server.port=8088

spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/superuser}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.kafka.bootstrap-servers=${KAFKA_SERVERS:kafka:9092}

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://eureka:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=${JWT_SECRET}
jwt.access-expiration=3600000
jwt.refresh-expiration=604800000

internal.api.key=${INTERNAL_API_KEY}

logging.level.org.springframework.security=DEBUG

server.address=0.0.0.0

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true