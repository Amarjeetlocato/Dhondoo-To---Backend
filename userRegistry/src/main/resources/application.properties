spring.application.name=USERREGISTRY
server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/user}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_SERVERS:kafka:9092}

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://eureka:8761/eureka/}
server.address=0.0.0.0
jwt.secret=${JWT_SECRET:afafasfafafasfasfasfafacasdasfasxASFACASDFACASDFASFASFDAFASFASDAADSCSDFADCVSGCFVADXCcadwavfsfarvf}

spring.mail.username=${SPRING_MAIL_USERNAME:whoami.amar@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
# ================= JWT =================

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
# 5 Hours in milliseconds
jwt.expiration=900000
jwt.refresh-expiration=604800000

# ================= JPA =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ================= CORS CONFIGURATION =================
# For Development: Allow all origins to test
# For Production: Restrict to specific domains
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With
cors.allow-credentials=false
cors.max-age=3600

# =========================
# MAIL CONFIG
# =========================

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false


spring.mail.host=smtp.gmail.com
spring.mail.port=587


logging.level.org.springframework.mail=DEBUG

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ================= EUREKA =================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.main.allow-bean-definition-overriding=true