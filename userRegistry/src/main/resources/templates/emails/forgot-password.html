<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Request - Dhondoo To</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #1A237E; color: #ffffff; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
        <h2 style="margin: 0;">Password Reset Request 🔑</h2>
    </div>
    <div style="border: 1px solid #ddd; padding: 25px; border-radius: 0 0 8px 8px; background-color: #ffffff;">
        <p>Hello <strong th:text="${name}">User</strong>,</p>
        <p>We received a request to reset your password on <strong>Dhondoo To</strong>.</p>
        <p>Your password reset OTP is:</p>
        <div style="background-color: #f1f3f5; padding: 15px; text-align: center; border-radius: 6px; margin: 20px 0;">
            <h1 style="margin: 0; color: #1A237E; letter-spacing: 4px;" th:text="${otp}">123456</h1>
        </div>
        <p>This OTP will expire in 10 minutes. If you did not request a password reset, please secure your account immediately.</p>
        <br>
        <p>Regards,<br><strong>Dhondoo To Team</strong></p>
    </div>
</body>
</html>
