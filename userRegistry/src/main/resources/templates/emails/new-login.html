<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Login Alert - Dhondoo To</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #1A237E; color: #ffffff; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
        <h2 style="margin: 0;">Security Alert: New Login 🔒</h2>
    </div>
    <div style="border: 1px solid #ddd; padding: 25px; border-radius: 0 0 8px 8px; background-color: #ffffff;">
        <p>Hello <strong th:text="${name}">User</strong>,</p>
        <p>A new login was detected on your <strong>Dhondoo To</strong> account.</p>
        <p><strong>Time:</strong> <span th:text="${time}">Recent</span></p>
        <p><strong>Device:</strong> <span th:text="${device}">Mobile</span></p>
        <p>If this was you, no action is required. If you do not recognize this activity, please change your password immediately.</p>
        <br>
        <p>Regards,<br><strong>Dhondoo To Team</strong></p>
    </div>
</body>
</html>
